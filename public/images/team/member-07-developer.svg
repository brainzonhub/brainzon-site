<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-member-07-developer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background Card Base -->
  <rect width="400" height="500" rx="0" fill="url(#bg-member-07-developer)" />

  <!-- Subtle Geometric Tech Grid Overlay -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="400" x2="400" y2="400" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
  </g>

  <!-- Glowing Radial Backdrop -->
  <circle cx="200" cy="200" r="140" fill="#ffffff" opacity="0.08" />

  <!-- Head Silhouette -->
  <circle cx="200" cy="180" r="64" fill="url(#avatar-grad)" stroke="#ffffff" stroke-width="2" opacity="0.9" />
  
  <!-- Shoulder Silhouette -->
  <path d="M 90 400 C 90 290, 310 290, 310 400 Z" fill="url(#avatar-grad)" stroke="#ffffff" stroke-width="2" opacity="0.9" />

  <!-- Initials Badge Circle -->
  <circle cx="200" cy="180" r="42" fill="#0f172a" opacity="0.75" />
  <text x="200" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">JW</text>

  <!-- Bottom Glassmorphic Label Strip -->
  <rect x="20" y="425" width="360" height="55" rx="14" fill="#0f172a" opacity="0.82" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
  <text x="200" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">James Wilson</text>
  <text x="200" y="468" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" fill="#0891b2" text-anchor="middle" letter-spacing="1">LEAD DEV</text>
</svg>